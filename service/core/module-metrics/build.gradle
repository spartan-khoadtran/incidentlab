// Prometheus-shaped meters on top of Micrometer: fixed latency buckets, label-keyed counters,
// histograms and gauges, plus the process and cgroup (container) binders behind the USE panels.
dependencies {
  api(libs.micrometer.core)

  testImplementation(libs.micrometer.registry.prometheus)
}

// The lab's image runs every service on the Serial collector, so the tests read its pool names.
tasks.withType(Test).configureEach {
  jvmArgs("-XX:+UseSerialGC")
}
