plugins {
  id("application")
  alias(libs.plugins.ksp)
  alias(libs.plugins.allopen)
}

group "com.c0x12c.incidentlab.checkoutapi"
version "1.0-SNAPSHOT"

// api:checkout: the service users hit through Envoy. GET /products/{id} (Redis, then Postgres),
// POST /checkout (Postgres, pricing, Kafka) and /health for Envoy's active checks. Thin: the
// controllers name only module-api, the manager and repositories are runtime wiring.
dependencies {
  implementation(libs.kotlin.stdlib)

  implementation(project(":domain:module-checkout:module-api"))
  implementation(project(":shared:module-client"))
  implementation(project(":shared:module-exception"))
  implementation(project(":shared:module-infra"))
  implementation(project(":core:module-faults"))
  implementation(project(":core:module-logging"))
  runtimeOnly(project(":domain:module-checkout:module-repository"))
  runtimeOnly(project(":domain:module-checkout:module-impl"))

  implementation(mn.micronaut.kotlin.runtime)
  implementation(mn.micronaut.runtime)
  implementation(mn.micronaut.http.server.netty)
  implementation(mn.micronaut.jackson.databind)
  implementation(mn.micronaut.inject)
  compileOnly(mn.micronaut.aop)
  ksp(mn.micronaut.inject.kotlin)

  // Server spans and W3C propagation for every route; the exporter ships them to Tempo over OTLP.
  implementation(mn.micronaut.tracing.opentelemetry.http)
  runtimeOnly(libs.opentelemetry.exporter.otlp) {
    exclude group: "io.opentelemetry", module: "opentelemetry-exporter-sender-okhttp"
  }
  runtimeOnly(libs.opentelemetry.exporter.sender.jdk)

  implementation(libs.jackson.module.kotlin)
  implementation(libs.logging.logback.classic)
  runtimeOnly(libs.utility.snakeyaml)
}

// Needed for @ExecuteOn on final Kotlin classes (controllers).
allOpen {
  annotation("io.micronaut.aop.Around")
}

application {
  mainClass.set("com.c0x12c.incidentlab.checkoutapi.Main")
  applicationName = "checkout-api"
}
