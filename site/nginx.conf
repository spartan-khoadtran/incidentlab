# Any other Host gets no answer, so a page that rebinds its own DNS name to 127.0.0.1 cannot drive the lab API.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Docker's DNS, looked up per request: nginx starts and serves the handbook while control is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $lab_api http://control:8090;
    proxy_pass $lab_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    error_page 502 503 504 = @lab_down;
  }

  location @lab_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":"lab_down","message":"The lab controller does not answer. Start the lab with make up, then try again."}';
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
