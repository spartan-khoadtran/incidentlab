name: redlab

# Shared settings for the JVM services: one image, a different launcher per service.
x-svc: &svc
  build: ./service
  image: redlab-svc:latest
  restart: unless-stopped
  environment: &svc-env
    TZ: ${TZ:-Asia/Ho_Chi_Minh}
    OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://tempo:4318}
    DB_URL: jdbc:postgresql://postgres:5432/lab
    DB_USERNAME: lab
    DB_PASSWORD: lab
    KAFKA_BOOTSTRAP: kafka:9092
    TRACE_SAMPLE_RATIO: "1.0"
    LOG_FORMAT: ${LOG_FORMAT:-text}

services:
  # ------------------------------------------------------------------ the system under test
  loadgen:
    <<: *svc
    environment:
      <<: *svc-env
      SERVICE_LAUNCHER: /run/app/loadgen/bin/loadgen
      SERVICE_NAME: loadgen
      PORT: "8003"
      TARGET_URL: http://envoy:8080
      # root sampling decision for every trace (api, pricing, worker follow it)
      TRACE_SAMPLE_RATIO: ${LOADGEN_TRACE_SAMPLE_RATIO:-0.25}
    cpus: "1.5"
    mem_limit: 512m
    memswap_limit: 512m
    labels:
      com.datadoghq.ad.checks: '{"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:8003/metrics", "namespace": "lab", "metrics": [".*"]}]}}'

  envoy:
    image: envoyproxy/envoy:v1.34.1
    restart: unless-stopped
    volumes:
      - ./config/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
      - "9901:9901"
    labels:
      com.datadoghq.ad.checks: '{"envoy": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9901/stats/prometheus"}]}}'

  api:
    <<: *svc
    environment:
      <<: *svc-env
      SERVICE_LAUNCHER: /run/app/checkout-api/bin/checkout-api
      SERVICE_NAME: api
      PORT: "8000"
      PRICING_URL: http://pricing:8001
      REDIS_HOST: redis
    cpus: "2.0"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    labels:
      com.datadoghq.ad.checks: '{"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:8000/metrics", "namespace": "lab", "metrics": [".*"]}]}}'

  pricing:
    <<: *svc
    environment:
      <<: *svc-env
      SERVICE_LAUNCHER: /run/app/pricing-api/bin/pricing-api
      SERVICE_NAME: pricing
      PORT: "8001"
    cpus: "2.0"
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      com.datadoghq.ad.checks: '{"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:8001/metrics", "namespace": "lab", "metrics": [".*"]}]}}'

  worker:
    <<: *svc
    environment:
      <<: *svc-env
      SERVICE_LAUNCHER: /run/app/orders-worker/bin/orders-worker
      SERVICE_NAME: worker
      PORT: "8002"
      KAFKA_PARTITIONS: "3"
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    labels:
      com.datadoghq.ad.checks: '{"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:8002/metrics", "namespace": "lab", "metrics": [".*"]}]}}'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
    volumes:
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"

  # Postgres seen from the inside (pg_stat_statements, pg_stat_activity)
  pgobserver:
    <<: *svc
    environment:
      <<: *svc-env
      SERVICE_LAUNCHER: /run/app/pgobserver/bin/pgobserver
      SERVICE_NAME: pgobserver
      PORT: "8004"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
    labels:
      com.datadoghq.ad.checks: '{"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:8004/metrics", "namespace": "lab", "metrics": [".*"]}]}}'

  # A batch job sharing the same machine; idle unless an exercise turns it on.
  # High CPU weight: when it runs, it wins most CPU contention against the other containers.
  noisy:
    <<: *svc
    cpu_shares: 65536
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *svc-env
      SERVICE_LAUNCHER: /run/app/noisy/bin/noisy
      SERVICE_NAME: noisy
      PORT: "8005"

  # Lab controller: applies the faults of the current exercise. `make new/hint/answer` run inside it.
  control:
    <<: *svc
    command: ["/run/app/labctl/bin/labctl", "daemon"]
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *svc-env
      SERVICE_NAME: control
      COMPOSE_PROJECT: redlab
      GRAFANA_URL: http://grafana:3000
      PROMETHEUS_URL: http://prometheus:9090
      LAB_STATE: /state/state.json
    volumes:
      - labstate:/state
      - /var/run/docker.sock:/var/run/docker.sock

  # ------------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=12h
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-red-layers.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # Traces. Read them in Grafana (Explore or Drilldown > Traces); there is no separate UI.
  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --no-collector.filesystem
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # ------------------------------------------------------------------ optional: Datadog (make up-datadog)
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    profiles: ["datadog"]
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: redlab-local
      DD_TAGS: env:redlab
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: 0.0.0.0:4317
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_LOGS_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  pgdata:
  promdata:
  tempodata:
  labstate:
