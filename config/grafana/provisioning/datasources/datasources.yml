apiVersion: 1
deleteDatasources:
  - name: Jaeger
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Open trace
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      streamingEnabled:
        search: true
        metrics: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -10m
        spanEndTimeShift: 10m
        tags:
          - key: service.name
            value: job
        queries:
          - name: Request rate by route
            query: sum by (route) (rate(http_server_requests_total{$$__tags}[1m]))
          - name: p99 latency by route
            query: histogram_quantile(0.99, sum by (le, route) (rate(http_server_duration_seconds_bucket{$$__tags}[1m])))
          - name: Worker processing p99 and lag
            query: histogram_quantile(0.99, sum by (le) (rate(kafka_processing_seconds_bucket{$$__tags}[1m]))) or max by (partition) (kafka_consumer_lag_seconds{$$__tags})
          - name: Client p99 by endpoint
            query: histogram_quantile(0.99, sum by (le, endpoint) (rate(client_duration_seconds_bucket{$$__tags}[1m])))
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        customQuery: false
        tags:
          - key: service.name
            value: service_name
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
