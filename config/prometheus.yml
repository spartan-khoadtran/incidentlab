global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: loadgen
    static_configs: [{ targets: ["loadgen:8003"] }]
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["envoy:9901"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: pricing
    static_configs: [{ targets: ["pricing:8001"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:8002"] }]
  - job_name: pgobserver
    static_configs: [{ targets: ["pgobserver:8004"] }]
  - job_name: noisy
    static_configs: [{ targets: ["noisy:8005"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: pyroscope
    static_configs: [{ targets: ["pyroscope:4040"] }]
